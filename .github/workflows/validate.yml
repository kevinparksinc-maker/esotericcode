name: Application quality gate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm check
      - name: Offline unit tests (credential integration suite runs against deployment)
        env:
          JWT_SECRET: ci-only-test-key-do-not-use-in-production
        run: pnpm exec vitest run --exclude server/github-oauth-credentials.test.ts
      - name: Production compile
        run: pnpm build
